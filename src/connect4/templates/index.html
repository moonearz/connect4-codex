<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Four</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
  </head>
  <body>
    <main data-game-url="{{ url_for('game_state') }}">
      <header><h1>Connect Four</h1></header>
      <section class="play-area" aria-label="Connect Four game">
        <aside aria-label="Game settings">
          <div class="field">
            <label for="mode">Opponent</label>
            <select id="mode">
              <option value="computer">Computer</option>
              <option value="human">A friend</option>
            </select>
          </div>
          <div class="field">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
              <option value="easy">Easy · Random</option>
              <option value="medium">Medium · Minimax</option>
              <option value="hard" selected>Hard · Alpha-beta</option>
              <option value="mcts">Monte Carlo</option>
              <option value="learned">Learning agent</option>
            </select>
          </div>
          <div class="field" id="seat-field">
            <label for="seat">Your turn order</label>
            <select id="seat">
              <option value="0">First · Red</option>
              <option value="1">Second · Yellow</option>
            </select>
          </div>
          <div class="players" aria-label="Player colors">
            <span
              ><i class="red" aria-hidden="true"></i
              ><span id="first-label">You · Red</span></span
            >
            <span
              ><i class="gold" aria-hidden="true"></i
              ><span id="second-label">Computer · Yellow</span></span
            >
          </div>
          <button id="reset" class="reset">New game</button>
          <p class="hint">
            Choose a column. Connect four horizontally, vertically, or
            diagonally.
          </p>
        </aside>
        <div class="game">
          <div class="game-heading">
            <p id="status" role="status" aria-live="polite">Loading…</p>
            <span id="counter">Move 1</span>
          </div>
          <div id="columns" class="columns" aria-label="Choose column"></div>
          <div id="board" class="board" aria-label="Game board"></div>
          <p id="error" role="alert"></p>
        </div>
      </section>
    </main>
  </body>
</html>
