<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #202e32;
        background: #f6f5ef;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 780px;
        margin: 64px auto;
        padding: 0 24px;
      }
      header {
        border-bottom: 1px solid #d9ded7;
        padding-bottom: 24px;
        margin-bottom: 32px;
      }
      h1 {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -1px;
        margin: 0;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 16px;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: inherit;
        text-decoration: none;
        background: #fffefa;
        border: 1px solid #d2d9d1;
        border-radius: 10px;
        padding: 22px;
      }
      a:hover {
        border-color: #658b73;
      }
      a:focus-visible {
        outline: 3px solid #d99535;
        outline-offset: 3px;
      }
      strong {
        display: block;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      p {
        font-size: 14px;
        color: #65736b;
        line-height: 1.5;
        margin: 0;
      }
      .arrow {
        color: #355c4d;
        font-size: 22px;
      }
      @media (max-width: 500px) {
        main {
          margin-top: 32px;
        }
        a {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header><h1>Projects</h1></header>
      <nav aria-label="Projects">
        <h2>Projects</h2>
        <ul>
          <li>
            <a href="/tictactoe/"
              ><div>
                <strong>Tic-tac-toe</strong>
                <p>Play against the computer.</p>
              </div>
              <span class="arrow" aria-hidden="true">→</span></a
            >
          </li>
          <li>
            <a href="/wordle/"
              ><div>
                <strong>Wordle solver</strong>
                <p>Find guesses from your Wordle feedback.</p>
              </div>
              <span class="arrow" aria-hidden="true">→</span></a
            >
          </li>
          <li>
            <a href="/connect4/"
              ><div>
                <strong>Connect Four</strong>
                <p>Play a friend or choose an AI opponent.</p>
              </div>
              <span class="arrow" aria-hidden="true">→</span></a
            >
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
